name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/freight-rate-calculator run build
        env:
          PORT: 5000
          BASE_PATH: /
          NODE_ENV: production
          VITE_API_URL: https://trucking-rate-calculator-app.replit.app
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudHJ1Y2tpbmctcmF0ZS1jYWxjdWxhdG9yLWFwcC5yZXBsaXQuYXBwJA' }}

      - name: SPA fallback and custom domain
        run: |
          cp artifacts/freight-rate-calculator/dist/public/index.html artifacts/freight-rate-calculator/dist/public/404.html
          echo "www.haulwizeeconomics.com" > artifacts/freight-rate-calculator/dist/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/freight-rate-calculator/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
